version: '3.8'

services:
  mansion-radio-bot:
    image: mansion-radio-bot:latest
    container_name: mansion-radio-bot
    user: "1000:1000"
    restart: unless-stopped
    environment:
      # IRC Configuration
      - IRC_SERVER=irc.example.com
      - IRC_PORT=6697
      - BOT_NICKNAME=MansionRadio
      - IRC_CHANNELS=#radio
      # SASL authentication (for registered nicks)
      # SASL_USERNAME is optional - defaults to BOT_NICKNAME if not set
      - SASL_USERNAME=your_sasl_username_here
      - SASL_PASSWORD=your_sasl_password_here
      # AzuraCast API
      - AZURACAST_API=https://radio.example.com/api/nowplaying/station_id
      # Polling interval (seconds)
      - POLL_INTERVAL=10
      # Timezone
      - TZ=Europe/Belgrade
    volumes:
      - ./logs:/app/logs
    networks:
      - mansion-net
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python main.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mansion-net:
    driver: bridge
